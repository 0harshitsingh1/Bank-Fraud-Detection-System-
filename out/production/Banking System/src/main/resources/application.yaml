spring:
  application:
    name: fraud-detection-service

  fraud:
    max-transaction-per-minute: 5
    suspicious-amount-multiplier: 5
    max-balance-percentage: 0.90

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group id: account-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.KsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
          value:
            default:
              type: java.util.HashMap
    producer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.KsonDeserializer

    server:
      port: 8084

    # Account Service URL for Feign Client
    account:
      service:
        url: http://localhost:8081

    management:
      endpoints:
        web:
          exposure:
            include: health, info