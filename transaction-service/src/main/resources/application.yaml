spring:
  application:
    name: transaction-service

  # MySQL Configuration
  datasource:
    url: jdbc:mysql://localhost:3307/transaction_account_db?createDatabaseIfNotExist=true
    username: banking_admin
    password: Harshit@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: transaction-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Server Configuration
server:
  port: 8082

# Account Service URL
account:
  service:
    url: http://localhost:8081

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info