spring:
  application:
    name: transaction-service

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
#    url: jdbc:mysql://localhost:3306/account_db?createDatabaseIfNotExist=true
#    username: root
#    password: root
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    jpa:
#      hibernate:
#        ddl-auto: update
#      show:sql: true
#      properties:
#        hibernate:
#          dialect: org.hibernate.dialect.MySQLDialect
    datasource:
      url: jdbc:mysql://localhost:3306/account_db?createDatabaseIfNotExist=true
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver

      jpa:
        hibernate:
          ddl-auto: update
        show-sql: true
        properties:
          hibernate:
            dialect: org.hibernate.dialect.MySQLDialect
    kafka:
      bootstrap-servers: localhost:9092
      consumer:
        group id: account-service-group
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.KsonDeserializer
        properties:
          spring:
            json:
              trusted:
                packages: "*"
              use:
                type:
                  headers: false
            value:
              default:
                type: java.util.HashMap
      producer:
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.KsonDeserializer

  server:
    post: 8082

  account:
    service:
      url: http://localhost8081

  management:
    endpoints:
      web:
        exposure:
          include: health, info